plugins { id 'com.android.application' }

android {
    namespace 'id.hondatuner.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'id.hondatuner.android'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.1.3-debug'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        xmlReport = true
        xmlOutput = file('build/reports/lint-results-debug.xml')
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.12.0'
}

name: Build Android APK

'on':
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (self-hosted by default)
        required: false
        default: self-hosted
        type: string
      upload_actions_artifacts:
        description: Also upload Actions artifacts when storage quota is available
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      upload_actions_artifacts:
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
      - 'honda_tuner_android/**'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
      - 'honda_tuner_android/**'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Locate Android project
        id: project
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const dir = fs.existsSync('app/build.gradle') ? '.' :
              fs.existsSync('honda_tuner_android/app/build.gradle') ? 'honda_tuner_android' : null;
            if (!dir) throw new Error('Android project was not found.');
            core.setOutput('dir', dir);

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          settings-path: ${{ runner.temp }}

      - name: Verify Android project
        run: python "${{ steps.project.outputs.dir }}/tools/verify_project.py"

      - name: Test protocol workers
        run: python "${{ steps.project.outputs.dir }}/tools/test_core.py"

      - name: Set up Android SDK
        if: runner.os != 'Windows'
        uses: android-actions/setup-android@v3

      - name: Set up Android SDK on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $sdkRoot = $env:ANDROID_SDK_ROOT
          if (-not $sdkRoot) { $sdkRoot = $env:ANDROID_HOME }
          if (-not $sdkRoot) { $sdkRoot = Join-Path $env:RUNNER_TEMP 'android-sdk' }
          $sdkTools = Join-Path $sdkRoot 'cmdline-tools\16.0'
          $sdkManager = Join-Path $sdkTools 'bin\sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkManager)) {
            $sdkArchive = Join-Path $env:RUNNER_TEMP 'android-commandline-tools.zip'
            $sdkExtract = Join-Path $env:RUNNER_TEMP 'android-commandline-tools'
            Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip' -OutFile $sdkArchive -UseBasicParsing
            Expand-Archive -LiteralPath $sdkArchive -DestinationPath $sdkExtract -Force
            New-Item -ItemType Directory -Path $sdkTools -Force | Out-Null
            Get-ChildItem -LiteralPath (Join-Path $sdkExtract 'cmdline-tools') -Force | Copy-Item -Destination $sdkTools -Recurse -Force
          }
          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkTools 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          1..20 | ForEach-Object { 'y' } | & $sdkManager "--sdk_root=$sdkRoot" --licenses
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK license acceptance failed.' }
          & $sdkManager "--sdk_root=$sdkRoot" platform-tools
          if ($LASTEXITCODE -ne 0) { throw 'Android platform-tools installation failed.' }

      - name: Install Android 35 build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile and sign debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" --no-daemon --console=plain :app:assembleDebug

      - name: Verify and package APK
        run: python "${{ steps.project.outputs.dir }}/tools/package_apk.py" --apk "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Save verified APK to a draft release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: delivery
        uses: actions/github-script@v8
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.dir }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const dir = process.env.ANDROID_PROJECT_DIR;
            const apk = path.join(dir, 'dist', 'HondaTuner-Android-debug.apk');
            const sidecar = apk + '.sha256';
            const verification = path.join(dir, 'evidence', 'apk_verification.json');
            const report = JSON.parse(fs.readFileSync(verification, 'utf8'));
            const digest = crypto.createHash('sha256').update(fs.readFileSync(apk)).digest('hex');
            if (report.result !== 'passed' || !report.android_sdk_compilation ||
                !report.apk_signature_verified || !report.zip_integrity_verified ||
                report.apk_sha256 !== digest ||
                fs.readFileSync(sidecar, 'utf8').trim().split(/\s+/)[0] !== digest) {
              throw new Error('The APK does not match its successful verification report and SHA-256 sidecar.');
            }
            const tag = 'android-debug-' + context.runId + '-' + (process.env.GITHUB_RUN_ATTEMPT || '1');
            const release = (await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'Honda Tuner Android debug - ' + context.runId,
              body: 'Verified debug APK from Actions run ' + context.runId +
                '.\n\nSHA-256: ' + digest +
                '\n\nPhysical Android USB and ECU testing has not been performed.',
              draft: true,
              prerelease: true
            })).data;
            const files = [
              [apk, 'application/vnd.android.package-archive'],
              [sidecar, 'text/plain'],
              [verification, 'application/json'],
              [path.join(dir, 'evidence', 'core_verification.json'), 'application/json'],
              [path.join(dir, 'evidence', 'project_verification.json'), 'application/json'],
              [path.join(dir, 'evidence', 'core_tests.txt'), 'text/plain'],
              [path.join(dir, 'evidence', 'reference_provenance.json'), 'application/json']
            ];
            for (const [file, contentType] of files) {
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name: path.basename(file),
                data,
                headers: {'content-type': contentType, 'content-length': data.length}
              });
            }
            core.setOutput('release_id', release.id);
            core.setOutput('tag', tag);
            core.setOutput('url', release.html_url);
            await core.summary
              .addHeading('Verified Honda Tuner Android debug APK')
              .addLink('Open the draft release (repository owner access)', release.html_url)
              .addRaw('\n\nSHA-256: ' + digest + '\n')
              .write();

      - name: Upload installable debug APK
        if: inputs.upload_actions_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HondaTuner-Android-debug
          path: |
            ${{ steps.project.outputs.dir }}/dist/HondaTuner-Android-debug.apk
            ${{ steps.project.outputs.dir }}/dist/HondaTuner-Android-debug.apk.sha256
            ${{ steps.project.outputs.dir }}/evidence/apk_verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification logs
        if: always() && inputs.upload_actions_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HondaTuner-Android-verification
          path: ${{ steps.project.outputs.dir }}/evidence/
          if-no-files-found: warn
          retention-days: 14

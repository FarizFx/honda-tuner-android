name: Android CI

'on':
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (self-hosted by default)
        required: false
        default: self-hosted
        type: string
      upload_actions_artifacts:
        description: Also upload Actions artifacts when storage quota is available
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    permissions:
      contents: write
    uses: ./.github/workflows/build-android.yml
    with:
      runner: ${{ inputs.runner }}
      upload_actions_artifacts: ${{ inputs.upload_actions_artifacts }}
